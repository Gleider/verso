[project]
name = "verso-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "verso-core",
    "verso-audio",
    "verso-asr",
    "verso-lyrics",
    "arq>=0.26",
]

[project.optional-dependencies]
# O que o worker precisa de verdade para rodar o pipeline completo.
ml = ["verso-audio[separation]", "verso-asr[whisper]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_worker"]
