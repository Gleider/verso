[project]
name = "verso-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "verso-core",
    "verso-audio",
    "verso-lyrics",
    "verso-video",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "arq>=0.26",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_api"]
