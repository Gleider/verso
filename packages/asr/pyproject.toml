[project]
name = "verso-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Pesado (~2 GB com o modelo). O pacote importa sem isso; só a implementação concreta precisa.
whisper = ["faster-whisper>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_asr"]
