[project]
name = "verso-audio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mutagen>=1.47"]

[project.optional-dependencies]
# torch + demucs passam de 2 GB. Ficam fora do sync padrão: só o worker precisa.
separation = ["demucs>=4.0.1", "torch>=2.4", "torchaudio>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verso_audio"]
