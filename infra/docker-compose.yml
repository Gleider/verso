name: verso

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verso}
      POSTGRES_DB: ${POSTGRES_DB:-verso}
    ports:
      # Porta do host configurável: outra instância pode já ocupar a padrão.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verso}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-verso}:${POSTGRES_PASSWORD:-verso}@postgres:5432/${POSTGRES_DB:-verso}
      REDIS_URL: redis://redis:6379/0
      VERSO_STORAGE_DIR: /data
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ../storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-verso}:${POSTGRES_PASSWORD:-verso}@postgres:5432/${POSTGRES_DB:-verso}
      REDIS_URL: redis://redis:6379/0
      VERSO_STORAGE_DIR: /data
      # Em contêiner não há MPS: a separação roda em CPU e fica mais lenta.
      VERSO_DEMUCS_DEVICE: ${VERSO_DEMUCS_DEVICE:-cpu}
      VERSO_WHISPER_MODEL: ${VERSO_WHISPER_MODEL:-large-v3}
      VERSO_WHISPER_DEVICE: ${VERSO_WHISPER_DEVICE:-cpu}
      VERSO_WHISPER_COMPUTE: ${VERSO_WHISPER_COMPUTE:-int8}
      TORCH_HOME: /models
      HF_HOME: /models
    # Em máquinas com GPU NVIDIA (Docker Desktop/WSL2 ou Linux nativo), o worker
    # pode usá-la. Sem GPU disponível o compose ignora a reserva e segue em CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../storage:/data
      # Sem este volume, cada rebuild rebaixa ~3 GB de modelo.
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        # Endereço pelo qual o NAVEGADOR alcança a API (porta publicada no host).
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
    environment:
      # Endereço pelo qual o SERVIDOR do Next alcança a API (rede do compose).
      INTERNAL_API_URL: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
